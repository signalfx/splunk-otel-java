# Lychee configuration file
# See https://lychee.cli.rs/guides/config/

timeout = 30
retry_wait_time = 5
max_retries = 6
max_concurrency = 4

# Check link anchors.
include_fragments = "full"

# Use a custom user agent to prevent being blocked by Splunk docs site
user_agent = 'Mozilla/5.0 (compatible; lychee/0.24.2; +https://github.com/lycheeverse/lychee)'

exclude = [
  '^https://developers.redhat.com/download-manager/file/jboss-eap-.*.zip',
  '^http://localhost.*',
  '^https://central.sonatype.com/service/rest/repository/browse/maven-snapshots/com/splunk/',
  '^https://nvd.nist.gov/vuln/.*',
  # fails with 403 in ci
  '^https://www.ibm.com/docs/en/was-liberty/base.*',
]

exclude_path = [
  'licenses/licenses.md'
]
