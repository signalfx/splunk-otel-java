name: Update bundled CSA version

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-csa-version
  cancel-in-progress: false

jobs:
  update-csa-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Update bundled CSA version
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/update-csa-version.sh
