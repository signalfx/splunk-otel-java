include:
  - project: 'ci-cd/templates'
    ref: main
    file: '/prodsec/.sast-scan.yml'
  - project: 'ci-cd/templates'
    ref: main
    file: '/prodsec/.oss-scan.yml'

image:
  name: "docker.repo.splunkdev.net/ci-cd/ci-container/maven-3.8-jdk-17:6.2.0"

stages:
  - build
  - verify
  - release
  - post-release

.gradle-job:
  before_script:
    - creds-helper init
    - |
      if [ "$CI_COMMIT_REF_PROTECTED" = "true" ]; then
        MAVEN_READER_ROLE="maven-reader-role"
        export MAVEN_REPOSITORY_URL="https://repo.splunkdev.net/artifactory/maven"
      else
        MAVEN_READER_ROLE="maven-test-reader-role"
        export MAVEN_REPOSITORY_URL="https://repo.splunkdev.net/artifactory/maven-test"
      fi
      eval "$(creds-helper gradle "artifactory:v2/cloud/role/$MAVEN_READER_ROLE")"

build:
  extends: .gradle-job
  stage: build
  script:
    - ./gradlew build -x :smoke-tests:test --scan --no-daemon --stacktrace

sast-scan:
  stage: verify
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
  extends: .sast_scan
  variables:
    SAST_SCANNER: "Semgrep"
    # Fail build on high severity security vulnerabilities
    alert_mode: "policy"

oss-scan:
  stage: verify
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
  extends: .oss-scan
  tags: []

snapshot:
  extends: .gradle-job
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
  script:
    - ./gradlew assemble publishToSonatype --no-daemon --stacktrace

release:
  extends: .gradle-job
  stage: release
  artifacts:
    when: always
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-alpha)?.*/'
  before_script:
    - ./scripts/install-gh-deps.sh
  script:
    - ./scripts/release.sh "$CI_COMMIT_TAG"

publish-docker-image:
  stage: post-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-alpha)?.*/'
  variables:
    SIGNING_SERVICE_ADDR: "https://signing.prod.svc.splunk8s.io"
  id_tokens:
    CI_JOB_JWT:
      aud:
        - $CICD_VAULT_ADDR
        - $SIGNING_SERVICE_ADDR
  before_script:
    - ./scripts/install-docker-deps.sh
    - ./scripts/install-gh-deps.sh
  script:
    - ./scripts/publish-docker-image.sh "$CI_COMMIT_TAG"

propagate-version:
  stage: post-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-alpha)?.*/'
  before_script:
    - ./scripts/install-gh-deps.sh
  script:
    - ./scripts/propagate-version.sh "$CI_COMMIT_TAG"
